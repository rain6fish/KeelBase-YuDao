#
# What this deployment is, in the runtime's own words.
#
# The runtime asks two questions its Java defaults cannot answer for a host: which business modules a
# deployment actually enables, and what they are called. Its defaults describe the repository's own
# demo (`crm`), so a host that says nothing about itself is described as a CRM-only system — which is
# false here, and is exactly the kind of falsehood an assistant that answers "what modules does this
# system have" would repeat to a user.
#
# It is a YAML file of ours rather than command-line arguments because the labels and descriptions are
# UI strings and therefore non-ASCII, and arguments reach the JVM through argv, where a Chinese string
# is at the mercy of the platform's argument encoding. A profile file is read as UTF-8, so the text is
# the text.
#
# It is a file of ours rather than a line in upstream's `application.yaml` for the reason this whole
# line runs on: upstream's files stay untouched, and the deployment's own settings live in the
# deployment's own files. `scripts/run-server.sh` activates the profile; nothing else has to know.
#
# 本部署**是什么**，用运行时自己的说法。
#
# 运行时问两个它的 Java 默认值替宿主答不了的问题：一个部署**实际启用**了哪些业务模块，以及它们**叫什么**。它的
# 默认值描述的是本仓自己的演示（`crm`），于是一个**关于自己什么都不说**的宿主，会被描述成一个只有 CRM 的系统 ——
# 在这里这是**假**的，而这正是「一个回答『这个系统有哪些模块』的助手」会转述给用户的假话。
#
# 它是一份**我们自己的 YAML 文件**、不是命令行参数，因为 label 与 description 是 UI 字符串、因而是非 ASCII 的，
# 而参数经 argv 到达 JVM，中文在那里**听凭平台参数编码摆布**。profile 文件按 UTF-8 读，故文字就是文字。
#
# 它是**我们自己的文件**、不是上游 `application.yaml` 里的一行，理由是本线赖以运行的那一条：上游的文件保持
# 一字未动，部署自己的设置住在部署自己的文件里。`scripts/run-server.sh` 激活该 profile，别的什么都不必知道。
#
# 运行时 pin：`keelbase4j-core` 与 `keelbase4j-springai` 为 0.1.11。本宿主**消费** execution ↔ trace
# 关联：`YudaoExecutionTraceFilter` 为每个请求起或复用 span 并设置运行时的 trace holder，ai1 跨 worker
# 边界把 trace id 带过去。该关联由 `plan/yd-trace-link` 落地（并入 main 的提交 `0e76496651`）。
#
# Runtime pins: `keelbase4j-core` and `keelbase4j-springai` are 0.1.11. This host **consumes** the
# execution ↔ trace link: `YudaoExecutionTraceFilter` starts or reuses a span per request and sets the
# runtime's trace holder, and ai1 carries the trace id across the worker boundary. The link landed with
# `plan/yd-trace-link` (merged into `main` as `0e76496651`).
keelbase:
  # 控制台助手的**常驻 agent** —— `sql/keelbase-assistant-agent.sql` 建的那一条（id 9001）。右侧抽屉据此
  # 知道跟谁说话；**没配时它如实说「未配置」**，而不是画一个空选择器。改模型 / 改提示词改的是那份种子，
  # 不是这里。
  #
  # The console assistant's **standing agent** — the one `sql/keelbase-assistant-agent.sql` creates (id
  # 9001). The drawer uses it to know who to talk to; **unset, the drawer says so** rather than drawing an
  # empty picker. Changing the model or the prompt means editing that seed, not this line.
  assistant:
    agent-id: 9001
  # 覆盖声明（`AW-3`）需要的**部署事实** —— 运行时从自己的表里看不见它们，只有部署方说得出来。三项都照
  # 本部署的真实情况填：运行时嵌在芋道里（`host: yudao`）；业务那一行由**宿主**写（工具调的是宿主的
  # service）；宿主**没有**一条不经本引擎的 AI 工具路径 —— ai1 的 MCP、SKILL、部署自己的工具与 ai1 RAG
  # 检索四路都经 `GovernedExecutionEngine`（见边界页；外部写没有确认、没有副作用台账，是**已声明**的缺口，
  # 不是绕开引擎）。不写这一段时运行时答成 `host: none`，`host-write-not-in-same-transaction` 与
  # `host-ai-path-not-governed` 两条缺口**永不出现** —— 那是一份**少报**的声明。
  #
  # The **deployment facts** a coverage statement (`AW-3`) needs — the runtime cannot see them from its own
  # tables; only the deployment can say them. All three follow what this deployment actually is: the
  # runtime is embedded in YuDao (`host: yudao`); the **host** writes the business row (a tool calls the
  # host's own service); and the host has **no** AI tool path that bypasses this engine — ai1's MCP, SKILL,
  # the deployment's own tools and ai1 RAG retrieval all go through `GovernedExecutionEngine` (see the
  # boundary page; an external write has no confirmation and no side-effect ledger, a **declared** gap, not
  # a bypass). Without this block the runtime answers as `host: none`, and
  # `host-write-not-in-same-transaction` and `host-ai-path-not-governed` never appear — a statement that
  # **under-reports**.
  coverage:
    host: yudao
    host-owns-business-write: true
    host-own-ai-path: false
  app:
    # `preset` 是 EASY-3 的**特性预设**（full / small / lite），不是模块清单；模块清单由下面的
    # `businessModules` 回答。显式写出的 `features` 覆盖预设默认值。
    #
    # `preset` is the EASY-3 **feature preset** (full / small / lite), not a module inventory; the
    # inventory is `businessModules` below. Explicit `features` values override the preset's defaults.
    preset: full
    # 只把本部署真正跑的业务面写成 true：crm 与产品目录（见 `deploy/demo-ecs/seed-manifest.txt` 的
    # `load` 与 `module-scope.sql` 的保留清单）。其余模块的种子是 `skip`、菜单被停用，故显式 false，
    # 让「问一个模块开没开」得到 false 而不是 undefined。
    #
    # Only the business faces this deployment actually runs are true: crm and the product catalogue
    # (see `load` in `deploy/demo-ecs/seed-manifest.txt` and the keep list in `module-scope.sql`). The
    # other modules' seeds are `skip` and their menus are switched off, so they are explicitly false —
    # asking whether one of them is on returns false, not undefined.
    features:
      crm: true
      bpm: false
      oa: false
      hrm: false
      fms: false
      report: false
      products: true
    # 这里只列 `features` 为 true 的业务模块，且必须与本部署加载的业务种子一致；
    # `scripts/capabilities-profile.test.mjs` 把这条一致性钉住。
    #
    # Only business modules whose `features` value is true are listed here, and the list must match the
    # business seeds this deployment loads; `scripts/capabilities-profile.test.mjs` holds that.
    businessModules:
      - id: crm
        label: CRM 系统
        description: 线索、客户、商机与合同
      - id: products
        label: 产品目录
        description: 销售维护的产品目录，只有属主能改自己的产品
