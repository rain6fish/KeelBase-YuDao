# SPDX-License-Identifier: Apache-2.0
#
# The admin UI's own nginx: static files at the root, the API under /admin-api and /app-api.
#
# This is the second nginx in the path. The outer one (the host platform's) only proxies the whole
# demo2 host here; the split between "static" and "API" is made at this layer, which is where the
# upstream UI's expectations live.
#
# 后台界面的那个 nginx：根路径是静态文件，接口在 /admin-api 与 /app-api 之下。
#
# 这是链路上的第二个 nginx。外面那个（宿主平台的）只把整个 demo2 域名转到这儿；「静态」与「接口」的
# 划分在这一层做，因为上游界面的预期就在这一层。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The page must not be cached by the browser: its assets carry content hashes in their names, so
    # every deployment renames them and deletes the old ones — a remembered `index.html` would point
    # at files that are no longer there, and the console would come up on the *previous* build (or not
    # at all). Without a `Cache-Control` nginx sends only `ETag`/`Last-Modified`, and browsers cache
    # that heuristically. The hashed assets themselves are safe to keep forever.
    # 页面**不能**被浏览器缓存：它的资源名里带内容哈希，故每次部署都会改名并删掉旧的——记住的
    # `index.html` 会指向已经不在的文件，控制台于是跑在**上一版**（或者干脆起不来）。没有
    # `Cache-Control` 时 nginx 只发 `ETag`/`Last-Modified`，而浏览器会**启发式**地把它缓存起来。
    # 带哈希的资源本身则可以长期缓存。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /admin-api/ {
        proxy_pass http://yudao-server:48080/admin-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
    }

    location /app-api/ {
        proxy_pass http://yudao-server:48080/app-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
    }

    # KeelBase's runtime surface sits at the server's *root*, not under /admin-api — it is where the
    # AI loop answers (`/ai/chat`, `/ai/task`), where the app describes itself (`/app/capabilities`,
    # `/app/provenance`), and where the governance evidence is read (`/audit/*`). Without these the
    # rest of the deployment would look fine while the model loop, switched on or not, stayed
    # unreachable.
    #
    # `/app/` and `/audit/` have no page in this app, so a prefix is enough for them. `/ai/` is not so
    # simple: the AI module's own pages live at `/ai/chat`, `/ai/image`, `/ai/console/…` as well, so a
    # bare `/ai/` prefix answers those with the backend's JSON and the page then looks *broken* rather
    # than mis-routed. Only the runtime's own paths are listed below, and `/ai/chat` — which is both a
    # page (GET) and the runtime endpoint (POST) — is decided by method.
    #
    # The runtime also registers `/auth`, `/customers` and `/follow_ups` at the root. Those are left
    # out on purpose — the first duplicates sign-in, the other two are the sample module's own
    # surface. Add them here if a demo needs them.
    #
    # KeelBase 运行时的面挂在服务**根路径**上、不在 /admin-api 之下——AI 回路在那儿应答（`/ai/chat`、
    # `/ai/task`），应用在那儿自述（`/app/capabilities`、`/app/provenance`），治理证据也在那儿读
    # （`/audit/*`）。没有这几条，部署其余部分看着正常，而模型回路无论开没开都**够不到**。
    #
    # `/app/` 与 `/audit/` 在本应用里没有页面，前缀就够。`/ai/` 没这么简单：AI 模块自己的页面也在
    # `/ai/chat`、`/ai/image`、`/ai/console/…`，故裸的 `/ai/` 前缀会用后端的 JSON 去答它们，页面看起来
    # 是**坏掉**而不是**走错路由**。下面只列运行时自己的路径；而 `/ai/chat`——它既是页面（GET）又是运行时
    # 端点（POST）——由方法决定。
    #
    # 运行时还在根路径注册了 `/auth`、`/customers`、`/follow_ups`。这三个**有意不暴露**——第一个与
    # 登录重复，后两个是样例模块自己的面。demo 若需要，在这里补上即可。
    location ~ ^/(app|audit)/ {
        proxy_pass http://yudao-server:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
    }

    location ~ ^/ai/(task|chat/stream|confirmations|my/confirmations|tool-effects|tools)(/|$) {
        proxy_pass http://yudao-server:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
    }

    # Exactly `/ai/chat`: a page for GET, the runtime endpoint for POST. nginx has no way to branch on
    # the method inside a location body without `if` (and `proxy_pass` inside `if` is the case nginx
    # warns about), so the POST is bounced to a named location instead.
    # 正好是 `/ai/chat`：GET 是页面，POST 是运行时端点。nginx 没有别的办法在 location 体内按方法分支
    # （而在 `if` 里写 `proxy_pass` 正是 nginx 警告的那种用法），故把这个 POST 弹到一个具名 location。
    location = /ai/chat {
        if ($request_method = POST) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }
    error_page 418 = @keelbase_runtime;
    location @keelbase_runtime {
        proxy_pass http://yudao-server:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
    }
}
