# SPDX-License-Identifier: Apache-2.0
#
# The admin UI's own nginx: static files at the root, the API under /admin-api and /app-api.
#
# This is the second nginx in the path. The outer one (the host platform's) only proxies the whole
# demo2 host here; the split between "static" and "API" is made at this layer, which is where the
# upstream UI's expectations live.
#
# 后台界面的那个 nginx：根路径是静态文件，接口在 /admin-api 与 /app-api 之下。
#
# 这是链路上的第二个 nginx。外面那个（宿主平台的）只把整个 demo2 域名转到这儿；「静态」与「接口」的
# 划分在这一层做，因为上游界面的预期就在这一层。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /admin-api/ {
        proxy_pass http://yudao-server:48080/admin-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
    }

    location /app-api/ {
        proxy_pass http://yudao-server:48080/app-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
    }

    # KeelBase's runtime surface sits at the server's *root*, not under /admin-api — it is where the
    # AI loop answers (`/ai/chat`, `/ai/task`), where the app describes itself (`/app/capabilities`,
    # `/app/provenance`), and where the governance evidence is read (`/audit/*`). Without these the
    # rest of the deployment would look fine while the model loop, switched on or not, stayed
    # unreachable. A regex location, so it wins over the SPA fallback above.
    #
    # The runtime also registers `/auth`, `/customers` and `/follow_ups` at the root. Those are left
    # out on purpose — the first duplicates sign-in, the other two are the sample module's own
    # surface. Add them here if a demo needs them.
    #
    # KeelBase 运行时的面挂在服务**根路径**上、不在 /admin-api 之下——AI 回路在那儿应答（`/ai/chat`、
    # `/ai/task`），应用在那儿自述（`/app/capabilities`、`/app/provenance`），治理证据也在那儿读
    # （`/audit/*`）。没有这几条，部署其余部分看着正常，而模型回路无论开没开都**够不到**。用正则
    # location，好让它压过上面的 SPA 兜底。
    #
    # 运行时还在根路径注册了 `/auth`、`/customers`、`/follow_ups`。这三个**有意不暴露**——第一个与
    # 登录重复，后两个是样例模块自己的面。demo 若需要，在这里补上即可。
    location ~ ^/(app|ai|audit)/ {
        proxy_pass http://yudao-server:48080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
    }
}
