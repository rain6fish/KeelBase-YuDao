# KeelBase-YuDao CI.
#
# Upstream ships two workflows of its own — `maven.yml` and `yudao-ui-admin.yml` — and both are
# dormant here: they trigger on `master`, while this repository's branch is `main`. They are
# upstream's files and are left as they were found; this repository adds its own rather than editing
# them, which is the same rule that keeps every other upstream file untouched (the running count of
# what we *have* touched is `YD-T4`). Their test-skip flags are therefore moot rather than
# authoritative: `maven.yml` never triggers on this repository's branches. The host's own Java tests
# and the ai1 module's own tests run for real in `conformance`, below.
#
# Nine jobs, and each answers a question the others cannot (one carries a step that answers a
# question of its own, marked where it appears):
#
#   path-refs            every path this repository writes about itself — in a comment, a doc, a
#                        script — points at a file it actually holds;
#   script-tests         every `scripts/*.test.mjs` this repository ships actually runs — one glob
#                        rather than a list, so a test added later is covered without editing this
#                        workflow; the topical jobs still name their own files, because a failure
#                        there should be read inside that job's question;
#   governance-boundary  no bean of ours hands a tool to Spring AI, which is the fact `D42`'s
#                        boundary rests on and is one `@Bean` away from no longer being true;
#   rendered-copy        every line of copy this layer's UI **renders** — locale messages through
#                        vue-i18n, template text through Vue's parser, and every template **mounted**
#                        through Vue's runtime so computed expressions are evaluated — carries no
#                        literal `**` or backtick, so issue rain6fish/KeelBase-YuDao#3's class of
#                        defect reddens CI rather than only a local build;
#   governance-registry  every module this host governs declares itself, and the name it declares is
#                        the one its own pointcuts point at — the set `YD-13` made countable;
#   console-pages        *a step inside `governance-registry`* — every page the assistant offers is a
#                        route the menus we ship compose, so a curated list cannot quietly point at a
#                        page that moved;
#   identity-matrix      *a step inside `governance-registry`* — the nine-page identity matrix (which
#                        role may open which governance page) is read off the seed SQL cell by cell, so
#                        a grant line cannot reverse that table silently;
#   generator            the committed generated files are still a Spec's output (`--check-boundary`)
#                        and still what that Spec says (`--check`);
#   family-block         the generated "KeelBase family" section at the top of this repository's
#                        READMEs still matches the stamp it was generated with — the copy carries its
#                        own hash, so this needs neither the sibling repositories nor the network;
#   governance-tests     the host's governance test package passes on its own — 20 classes, no
#                        database, Redis or port — so a broken governance fact fails fast instead of
#                        waiting behind the full-stack `conformance` job;
#   conformance          the application conforms end to end against a **running** stack (PostgreSQL
#                        + Redis + the host), and the four governance rates are readable — driven, not
#                        quoted; it is also where the host's Java tests and the ai1 module's own tests
#                        run.
#
# All but `generator`, `governance-tests` and `conformance` are pure Node and finish in seconds, except
# `rendered-copy`: it is pure Node too, but it fetches the UI checkout and installs the gate's four
# packages, so it costs about a minute.
# `generator` and `governance-tests` want a JDK 25 toolchain and a Maven build, so they cost minutes;
# `generator` is kept to its two **offline** checks, and `governance-tests` to the governance package.
#
# `conformance` is the one job that needs a service stack, because calling the scenario scripts without
# a host would not be running them. It brings up PostgreSQL (with pgvector) and Redis as service
# containers, builds the host, runs the host's Java tests and the ai1 module's own tests, loads the
# seed, starts the server, waits for `/actuator/health`, and then runs
# `scripts/run-app-conformance.mjs`. Two of that suite's
# columns have the **model path** as their subject (MCP's two real model steps, and the assistant
# drawer's real session), so the job sets
# `CONFORMANCE_NO_MODEL_KEY=1`: those two columns are recorded `SKIP` with that reason, never `PASS`,
# and every deterministic column is still driven. No model key is needed or present.
#
# 上游自带两个 workflow —— `maven.yml` 与 `yudao-ui-admin.yml` —— 在本仓都是**休眠**的：它们触发于
# `master`，而本仓分支是 `main`。它们是上游的文件、照原样留着；本仓**新增**自己的，而不是去改它们——
# 这与「其余上游文件一律不碰」是同一条规矩（我们究竟碰过哪些，见 `YD-T4` 的记账）。故它们里的
# 测试 skip 开关在本仓**不作数**：`maven.yml` 在本仓的分支上根本不触发。宿主自己的 Java 测试、以及 ai1
# 模块自己的测试，都在下面的 `conformance` 里**真跑**。
#
# 九道 job，各答一个别的 job 答不了的问题（其中一道还带着一个自己回答问题的 step，在它出现的地方标出）：
#
#   path-refs            本仓写到自己身上的每一条路径——注释里的、文档里的、脚本里的——都指向一个它
#                        确实持有的文件；
#   script-tests         本仓带的每个 `scripts/*.test.mjs` 都真的跑得起来 —— 用一条 glob 而不是一份清单，
#                        故以后新加的测试不改这个 workflow 就已经在射程内；分题的 job 仍各自点名自己的
#                        文件，因为那里的失败应当在**那道 job 的问题**里去读；
#   governance-boundary  我们自己没有任何 bean 把工具交给 Spring AI —— `D42` 那条边界所倚的**事实**，
#                        而它离「不再成立」只差一个 `@Bean`；
#   rendered-copy        这一层界面**渲染出来**的每一行字——词条经 vue-i18n、模板文本经 Vue 自己的解析器、
#                        且每个模板再**真挂载**一次让表达式被求值——都不带字面的 `**` 或反引号，故 issue
#                        rain6fish/KeelBase-YuDao#3 那一类缺陷在 CI 上就红，而不是只在本地构建里；
#   governance-registry  本宿主治理的每个模块都**自报**，而它报的名字**就是**它自己 pointcut 所指的那一个
#                        —— `YD-13` 让它**数得出来**的那个集合；
#   console-pages        *`governance-registry` 里的一个 step* —— 助手提供的每一页，都是**我们发布的菜单**
#                        解得出来的一条路径，策展清单因而不会悄悄指向一个已经挪走的页面；
#   identity-matrix      *`governance-registry` 里的一个 step* —— 九页身份矩阵（哪个角色能开哪一页治理页）
#                        从种子 SQL 逐格读出来，一条授予改不成「悄悄反转这张表」；
#   generator            已提交的生成物仍是 Spec 的输出（`--check-boundary`）、且仍是那份 Spec 说的
#                        东西（`--check`）；
#   family-block         本仓 README 开头生成的「KeelBase 家族」段仍与生成时的戳相符 —— 副本自带哈希，
#                        故既不需要兄弟仓、也不需要联网；
#   governance-tests     宿主治理测试包自己就能过 —— 20 个类，不需要数据库、Redis 或端口 —— 故一条治理
#                        事实坏了会**先**红，而不是排在整套栈的 `conformance` 后面等；
#   conformance          应用对着**跑着的栈**（PostgreSQL + Redis + 宿主）端到端符合，且四个治理率可读
#                        —— 驱动门禁，不誊抄门禁；宿主的 Java 测试与 ai1 模块自己的测试也在这里跑。
#
# 其余各道是纯 Node 或离线检查、几秒到一分钟（`rendered-copy` 要拉一次界面检出、装门禁那四个包，故约
# 一分钟）。`generator` 与 `governance-tests` 要 JDK 25 工具链与 Maven 构建，以分钟计。最后一道
# `conformance` 是本文件里**唯一**需要一套**跑着的栈**的：
# service containers 起 PostgreSQL（带 pgvector）与 Redis → 构建宿主 → 跑宿主的 Java 测试与 ai1 模块自己的
# 测试 → 灌种子 → 起服务 → 等 `/actuator/health` → 跑 `scripts/run-app-conformance.mjs`。不起宿主直接调
# 那些脚本，那不叫跑过它。
# 套件里有两栏的主语是**模型那条路**（MCP 的两个真模型步、抽屉的真会话），故这道 job 置
# `CONFORMANCE_NO_MODEL_KEY=1`：那两栏记 `SKIP` 并写出原因、**绝不记 `PASS`**，其余确定性的栏照常驱动。
# 这道 job **不接**任何真模型 key。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  path-refs:
    name: Every path this repository cites resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Called through `node`, not by its own path. This repository is developed on Windows, where
      # `core.filemode` is false, so the executable bit cannot be committed — a step that depended on
      # the bit would fail on a permission problem that has nothing to do with path references. The
      # same note, for the same reason, is in the sibling repositories' workflows.
      - name: Cited paths must exist
        run: node scripts/check-path-refs.mjs

  script-tests:
    name: Every script test this repository ships runs
    runs-on: ubuntu-latest
    env:
      # 两个**数渲染**的测试要一份铺好的界面检出（`target/yudao-ui-admin-vue3`，或 `KEELBASE_YUDAO_UI`
      # 指过去）：闸门要用那个检出的 Vue 工具链，而干净 clone 里没有 `node_modules`。它们没有检出时**按
      # 设计红**（不悄悄跳过），所以不能在这个 job 里跑 —— 它们由 `rendered-copy` job 跑，那里正是铺检出
      # 的那一步。名字只在这里写一次，排除与守卫读同一份。
      #
      # The two **render-measuring** tests need a UI checkout laid down (`target/yudao-ui-admin-vue3`, or
      # `KEELBASE_YUDAO_UI` pointing at one): the gate resolves the Vue toolchain from that checkout, and a
      # clean clone has no `node_modules`. With no checkout they go **red by design** (never a quiet skip),
      # so they cannot run in this job — they run in `rendered-copy`, which is the job that lays the
      # checkout down. The names are written once, here, and both the exclusion and the guard read them.
      UI_DEPENDENT_TESTS: 'scripts/rendered-copy-expressions.test.mjs scripts/rendered-copy-components.test.mjs'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # One glob rather than a list — a list is exactly what left nine of these files outside CI
      # (seven page/helper tests that predate this job, plus the two this week's fixes added). A test
      # file that no step names is a test that never runs, and nothing about it looks wrong.
      # 一条 glob 而不是一份清单 —— 正是清单让这几个文件留在了 CI 之外（7 个早于这道 job 的页面/助手
      # 测试，加上本周两笔修复带来的两个）。没有任何 step 点名的测试文件 = 永远不跑的测试，而它表面上
      # 看不出任何不对。
      #
      # 上面那两个要检出的文件按名排除 —— 但**排除不等于没人跑**：下一条 step 对每个名字断言「本流水线里
      # 另有一步用 `node --test` 点名它」。少一个、或那一句被删掉，这里就红，于是「没人跑」仍然是一条能
      # 读到的红，而不是一条看不见的遗漏。
      #
      # The two files that need the checkout are excluded **by name** — but **exclusion is not "nobody runs
      # it"**: the next step asserts, for each name, that another step in this pipeline runs `node --test`
      # on it. Lose one, or lose that line, and this job goes red — so "nobody runs it" stays a red somebody
      # can read rather than an omission nobody can see.
      - name: Run every script test
        run: |
          pattern=$(echo "$UI_DEPENDENT_TESTS" | tr ' ' '|')
          node --test $(ls scripts/*.test.mjs | grep -Ev "^($pattern)$")
      - name: Every excluded test is run by another step
        run: |
          for f in $UI_DEPENDENT_TESTS; do
            if ! grep -q "node --test $f" .github/workflows/ci.yml; then
              echo "::error::$f is excluded from script-tests, and no step runs it — exclusion must not become 'never runs'"
              exit 1
            fi
            echo "ok    $f runs elsewhere in this pipeline"
          done

  governance-boundary:
    name: No bean of ours hands a tool to Spring AI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Pure Node: it reads the source and there is no toolchain to set up. This is `D42`'s boundary
      # made continuous — what it reads is the invariant a single new `@Bean` would break, and that is
      # exactly why it must not be left to whoever remembers to run it.
      # 纯 Node：读源码、无需工具链。这是把 `D42` 的边界变成**持续**控制 —— 它读的那条不变量，正是一个
      # 新加的 `@Bean` 会打破的那一条；也正因如此，它不该取决于「谁记得跑」。
      - name: Our tools must not be reachable by a model without KeelBase
        run: node scripts/check-ungoverned-tool-beans.mjs
      # 那条事实的另一半：上一步看不见 `yudao-module-ai`，故说不出「全构建唯一的工具 `@Bean` 是上游示例」。
      # `--whole-build` 扫全部模块的生产源码、只放行那一个；多出一个、或它不见了，这一步就红。
      #
      # The other half of that fact: the step above cannot see `yudao-module-ai`, so it cannot say the only
      # tool `@Bean` in the build is upstream's sample. `--whole-build` scans every module's production
      # sources and allows exactly that one; a second one, or its disappearance, turns this step red.
      - name: The only tool bean in the whole build is upstream's sample
        run: node scripts/check-ungoverned-tool-beans.mjs --whole-build

      # 同一条边界还有面向读者的一半：控制台那页必须把「它扣不住的」区块画出来，中英都要有，且取自门禁
      # 记录。这道测试把模板、双语词条与记录放在一起读 —— 块不再渲染时，是门禁变红，而不是等走查时才被发现。
      # The same boundary has a reader-facing half: the console page must draw the "not held by it"
      # block, in both languages, from the gate's record. This reads the template, the bilingual
      # messages and the record together, so a block that stops rendering turns the gate red rather
      # than being noticed only when someone walks the page.
      - name: The boundary page must draw its not-held block, in both languages
        run: node --test scripts/boundary-page.test.mjs

      # 「面向读者」还有更宽的一半：消息只是数据，标记不会被解释、只会被打印。2026-10-25 走查在决策轨迹的
      # 覆盖声明与边界页的警示里都读到了字面的 `**` 和反引号。这道测试读中英两套词条、逐条走完每个叶子，
      # 谁把标记写回消息里，它就红 —— 并报出是哪一套、哪个键。
      #
      # The reader-facing half has a wider form: a message is data, so a marker is printed rather than
      # interpreted. The 2026-10-25 walk read literal `**` and backticks in the trace coverage line and
      # in the boundary warning. This reads both bundles, every leaf, and turns red on whoever types a
      # marker back into a message — naming the bundle and the key.
      - name: No message prints Markdown at the reader
        run: node --test scripts/i18n-no-markdown.test.mjs

      # 上一步管的是消息里**写了什么**，这一步管消息**在不在**。2026-10-29 走查读到审计链页表头原样印着
      # `keelbase.audit.colObject`：模板用了它，整个界面层零定义，而构建与既有门禁全绿 —— 缺键不是语法
      # 错误，它只在渲染那一刻变成读者眼前的一串键名。这道测试把本层模板与补丁新增行里用到的每个
      # `keelbase.*` 键，对上补丁里那两棵消息树；只往一边加，也一并判红。
      #
      # The step above is about what a message **says**; this one is about whether it is there at all. The
      # 2026-10-29 walk read `keelbase.audit.colObject` printed in the audit chain page's header: the
      # template used it, nothing in this layer defined it, yet the build and every existing gate stayed
      # green — a missing key is not a syntax error; it becomes the key name in front of the reader only
      # at render time. This test matches every `keelbase.*` key this layer's templates and patch
      # additions use against the patch's two message trees, and turns red on a key added to one side only.
      - name: Every keelbase key a page renders is defined, in both languages
        run: node --test scripts/i18n-key-coverage.test.mjs

      # 展开审计行是 M7 的证据面：展开块里调用的每个 helper 都必须在同一文件里有定义或导入。
      # 2026-10-25 实测：`toolRisk` 既没定义也没导入，展开任意一行时表体整块不渲染，而构建与既有门禁全绿。
      # The audit row's expansion is M7's evidence surface: every helper the expand block calls must
      # resolve in the same file. Measured 2026-10-25: `toolRisk` was neither defined nor imported,
      # expanding any row rendered no table body, while the build and every existing gate stayed green.
      - name: Every helper the audit row's expansion calls resolves
        run: node --test scripts/audit-chain-page.test.mjs

  # 渲染级的文案门禁一直都在，只是**只跑在本地构建里**：`scripts/check-rendered-copy.mjs` 由
  # `scripts/build-host-ui.sh` 的 2a 段调用，而 CI 上只有字符串级的 `scripts/i18n-no-markdown.test.mjs`
  # ——它读词条文本，看不见模板，也看不见 vue-i18n 渲染之后的样子（issue `rain6fish/KeelBase-YuDao#3`
  # 记的正是被原样画出来的 `**`）。这道 job 把同一条闸接进 CI：按 1b 段的顺序铺增量（删除清单 →
  # 覆盖目录 → 补丁，依序），然后跑两道闸门——解析级的那道，与把每个模板**真挂载**一次的姊妹闸。
  #
  # 它不装整套应用依赖：闸只要 vue、vue-i18n、`@vue/compiler-sfc` 与 `@vue/compiler-dom` 这几个包，而
  # `check-rendered-copy.mjs` 是 `createRequire` 从 `<UI>/node_modules` 解析的。版本钉在检出自己的
  # `package.json` + `pnpm-lock.yaml` 上（vue 3.5.34 / vue-i18n 11.4.0）：渲染行为取决于这两个包，版本
  # 一漂，`t()` 与模板解析就不再是应用用的那一套。克隆之后那一步断言「检出声明的就是这里要装的」，故
  # 抬界面钉却忘了抬版本会**响亮地**失败，而不是拿另一套渲染器验出一道假绿。
  #
  # 缺检出时闸门**退出 2**，而本 job 没有 `continue-on-error`、也不把闸包进 `|| true`：跳过在这条线上
  # 就是假绿。末尾那条 self-check 把「缺检出必须是 2」也钉住，免得后来有人把它改成一个安静的 0。
  #
  # The rendered-copy gate has always existed, but it ran only in the local build:
  # `scripts/check-rendered-copy.mjs` is called from `scripts/build-host-ui.sh` §2a, while CI had only the
  # string-level `scripts/i18n-no-markdown.test.mjs` — which reads message text and can see neither the
  # templates nor what vue-i18n renders (issue `rain6fish/KeelBase-YuDao#3` is exactly a `**` drawn
  # literally). This job wires the same gate into CI: it lays the delta down in §1b's order (removals →
  # overlay → patches), then runs both gates — the parse-level one, and its sibling that **mounts**
  # every template so computed expressions are evaluated.
  #
  # It does not install the whole app: the gate needs vue, vue-i18n, `@vue/compiler-sfc` and
  # `@vue/compiler-dom`, because `check-rendered-copy.mjs` resolves them through `createRequire` from
  # `<UI>/node_modules`. The versions are pinned to the checkout's own `package.json` + `pnpm-lock.yaml`
  # (vue 3.5.34 / vue-i18n 11.4.0): rendering behaviour is theirs, and a drift makes `t()` and the
  # template parser something other than what the app runs. The step after the clone asserts that the
  # checkout declares what this job installs, so raising the UI pin without raising these fails loudly
  # instead of validating a green on a second renderer.
  #
  # With no checkout the gate **exits 2**, and this job carries no `continue-on-error` and never wraps
  # the gate in `|| true`: a skip here is a false green. The self-check at the end pins the exit code too,
  # so nobody can later turn it into a quiet 0.
  rendered-copy:
    name: No rendered line of copy carries a literal Markdown marker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UI_DIR: target/yudao-ui-admin-vue3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 与 `build-host-ui.sh` §1 同形：钉住的是**提交**，不是分支——五份补丁是针对 `9bd6a91` 写的，
      # 上游 master 一往前动，补丁就地失效。抬这个值必须**与补丁一起**做。
      #
      # Same shape as `build-host-ui.sh` §1: the pin is a **commit**, not a branch — the five patches
      # were written against `9bd6a91`, and upstream moving on invalidates them. Raising this value is a
      # deliberate edit made **together with** the patches.
      - name: Fetch the pinned UI checkout
        env:
          UI_REPO: https://gitee.com/yudaocode/yudao-ui-admin-vue3.git
          UI_MIRROR: https://github.com/yudaocode/yudao-ui-admin-vue3.git
          UI_REF: 9bd6a91286573af70874ebd9c23d73177dd8001d
        run: |
          set -euo pipefail
          # 主远端是 Gitee（与 `build-host-ui.sh` 的默认一致）；runner 上够不着它时退到 GitHub 镜像。
          # 镜像也持有 `9bd6a91`（2026-10-27 在本机取过），故兜底是一件验过的事实，不是猜的——
          # 一条拉不到检出就会永久变红的 job，与把闸留在本地没有区别。
          #
          # The primary remote is Gitee (the build script's own default); when a runner cannot reach it,
          # fall back to the GitHub mirror. The mirror holds `9bd6a91` too (fetched locally on 2026-10-27),
          # so the fallback is a measured fact rather than a guess — a job that can never fetch its
          # checkout would be permanently red, which is no better than leaving the gate in the local build.
          clone_from() {
            rm -rf "$UI_DIR"
            git clone --depth 1 "$1" "$UI_DIR"
          }
          if ! clone_from "$UI_REPO"; then
            echo "could not clone $UI_REPO — trying the GitHub mirror" >&2
            clone_from "$UI_MIRROR"
          fi
          git -C "$UI_DIR" fetch --depth 1 origin "$UI_REF"
          git -C "$UI_DIR" checkout --quiet --detach FETCH_HEAD
          # 铺补丁之前先把「钉」验证掉：对错了树，后面每一步都会以别种名目失败。
          # Prove the pin before laying anything on it: against the wrong tree, every later step fails
          # under some other name.
          test "$(git -C "$UI_DIR" rev-parse HEAD)" = "$UI_REF"

      # 检出的 `package.json` 声明 vue 3.5.34 / vue-i18n 11.4.0，与下面装的一致；不一致就红。
      # The checkout's `package.json` declares vue 3.5.34 / vue-i18n 11.4.0, the same versions the step
      # below installs; a disagreement is red.
      #
      # 装到一个**另起的空目录**再链进来，而不是在检出里 `npm install <pkg>`：后者会按检出自己的
      # `package.json` 把整套应用依赖解一遍（以分钟计，且 npm 不认那份 pnpm lockfile），而闸只要这四个包。
      # 链进来是因为闸从 `<UI>/node_modules` 解析；`realpathSync` 会跟过去，行为不受影响。
      #
      # Install into a separate empty directory and link it in, rather than `npm install <pkg>` inside the
      # checkout: the latter resolves the app's **entire** dependency tree from that package.json (minutes,
      # and npm does not honour the pnpm lockfile), while the gate needs four packages. It is linked in
      # because the gate resolves from `<UI>/node_modules`; `realpathSync` follows the link, so behaviour
      # is unchanged.
      - name: Install the gate's rendering toolchain at the checkout's own versions
        run: |
          set -euo pipefail
          node -e '
            const pkg = require("./" + process.env.UI_DIR + "/package.json")
            const want = { vue: "3.5.34", "vue-i18n": "11.4.0" }
            let bad = false
            for (const [name, version] of Object.entries(want)) {
              const declared = (pkg.dependencies ?? {})[name] ?? (pkg.devDependencies ?? {})[name]
              if (declared !== version) {
                console.error(`${name}: the checkout declares ${declared}, this job installs ${version}`)
                bad = true
              }
            }
            if (bad) {
              console.error("raise the UI pin and the patch set together, or move both versions together")
              process.exit(1)
            }
            console.log("the checkout and the gate install the same vue and vue-i18n")
          '
          DEPS="$RUNNER_TEMP/rendered-copy-deps"
          mkdir -p "$DEPS"
          ( cd "$DEPS" && npm init --yes >/dev/null && \
            npm install --no-audit --no-fund --ignore-scripts \
              vue@3.5.34 vue-i18n@11.4.0 @vue/compiler-sfc@3.5.34 @vue/compiler-dom@3.5.34 )
          ln -s "$DEPS/node_modules" "$UI_DIR/node_modules"

      # 1b 段的三步，顺序就是那里的顺序：删除 → 覆盖 → 补丁。每一步都**响亮地失败**：路径不在了、
      # 覆盖放不进去、补丁贴不上，说的都是上游动了、这份增量要重做——而不是跳过它、让检查对着半我们的树。
      #
      # §1b's three steps, in its order: removals → overlay → patches. Each fails **loudly**: a path that
      # is gone, an overlay that cannot be placed, a patch that no longer applies — all of them mean
      # upstream moved and this delta has to be revisited, never that it should be skipped and the gate
      # run against a half-ours tree.
      - name: Lay the delta down — removals, overlay, patches
        run: |
          set -euo pipefail
          # 每个路径都用**绝对**路径，与 `build-host-ui.sh` 里 `REPO_ROOT` 打头的那份一致。原因很实在：
          # `git -C <检出>` 会先把进程切到检出里再解析参数，故相对的补丁路径会在**检出内部**去找
          # （本机第一次跑就是这么红的：`can't open patch 'keelbase-ui/…'`，被当成「补丁贴不上」）。
          #
          # Every path here is **absolute**, the way the `REPO_ROOT`-prefixed ones are in
          # `build-host-ui.sh`. The reason is concrete: `git -C <checkout>` moves the process into the
          # checkout before resolving arguments, so a relative patch path is looked for **inside the
          # checkout** (the first local run went red exactly this way: `can't open patch 'keelbase-ui/…'`,
          # reported as "the patch does not apply").
          UI="$PWD/$UI_DIR"
          OVERLAY="$PWD/keelbase-ui/host-overlay"
          PATCHES="$PWD/keelbase-ui/host-patches"
          REMOVALS="$PWD/keelbase-ui/host-removals.txt"

          while IFS= read -r rel || [[ -n "$rel" ]]; do
            rel="${rel#"${rel%%[![:space:]]*}"}"   # trim leading whitespace
            rel="${rel%"${rel##*[![:space:]]}"}"   # trim trailing whitespace
            [[ -z "$rel" || "$rel" == \#* ]] && continue
            case "$rel" in
              /* | *..*)
                echo "removal list entry is not a plain repo-relative path: $rel" >&2
                exit 1
                ;;
            esac
            if [[ ! -e "$UI/$rel" ]]; then
              echo "removal list names a path upstream no longer has: $rel" >&2
              echo "upstream moved it — the removal list has to be revisited, not skipped" >&2
              exit 1
            fi
            rm -rf "${UI:?}/$rel"
            echo "removed $rel"
          done < "$REMOVALS"

          while IFS= read -r -d '' f; do
            rel="${f#"$OVERLAY"/}"
            mkdir -p "$(dirname "$UI/$rel")"
            cp "$f" "$UI/$rel"
            echo "added $rel"
          done < <(find "$OVERLAY" -type f -print0)

          for p in "$PATCHES"/*.patch; do
            [[ -e "$p" ]] || continue
            if ! git -C "$UI" apply --check "$p" 2>/dev/null; then
              echo "patch does not apply cleanly: $(basename "$p")" >&2
              echo "upstream changed the code it edits — the patch has to be rebased, not skipped" >&2
              exit 1
            fi
            git -C "$UI" apply "$p"
            echo "applied $(basename "$p")"
          done

      # 这一步就是 2a 段在 CI 上的那一份。缺检出时它退出 2，step 因而变红——不跳过、也不 `|| true`。
      # This is §2a on CI. With no checkout it exits 2, which reddens the step — no skip, no `|| true`.
      - name: No rendered line of copy may carry a literal `**` or a backtick
        run: node scripts/check-rendered-copy.mjs "$UI_DIR"

      # 闸门自己也要有人测：临时目录里搭一份只够它跑的 UI 样子，逐例种一个**算出来的**记号，看它红、点名、
      # 复原后转绿。它挂在这里而不是别的 job，是因为它要的正是这一步已经铺好的检出 —— 换个 job 就得再铺一遍。
      # `@babel/parser` 是上一步装的 `@vue/compiler-sfc` 的直接依赖，故表达式那一层不用多装一个包。
      #
      # The gate needs a keeper of its own: a fixture built in a temp directory, one **computed** marker
      # seeded per case, and the gate must go red, name the file, and return to green once restored. It
      # hangs here rather than in another job because it needs exactly the checkout this step has already
      # laid down — anywhere else would lay it down a second time. `@babel/parser` is a direct dependency
      # of the `@vue/compiler-sfc` installed above, so the expression layer needs no extra package.
      - name: The gate goes red on a marker an expression computes
        env:
          KEELBASE_YUDAO_UI: target/yudao-ui-admin-vue3
        run: node --test scripts/rendered-copy-expressions.test.mjs

      # 挂载闸门也要有人测：一条只有挂载才看得见的种子（`{{ '*' + '*' }}`），解析闸必须绿、挂载闸必须红并点名。
      # 它顺带守住「桩层坏掉时不许假绿」—— 桩把模板渲染空了，那条种子就红不起来，这一步随之红。
      #
      # The mount gate needs a keeper too: one seed only a mount can see (`{{ '*' + '*' }}`), where the parse
      # gate must stay green and the mount gate must go red naming the file. It also keeps "a broken stub
      # layer must not read green" — if the stubs render everything empty, the seed cannot go red, and this
      # step goes red with it.
      - name: The mount gate goes red on a marker only a mount can see
        env:
          KEELBASE_YUDAO_UI: target/yudao-ui-admin-vue3
        run: node --test scripts/rendered-copy-components.test.mjs

      # 2a 段的另一半：把每个模板**真挂载**一次，表达式被求值。解析看不见 `{{ '*' + '*' }}` 这类
      # 算出来的记号；这一步看得见。边界（不执行 `<script>`、不用接口数据）写在那份脚本头部。
      # The other half of §2a: every template is **mounted**, so expressions are evaluated. A parse
      # cannot see a computed `{{ '*' + '*' }}`; this step can. Its boundary (no `<script>`, no API
      # data) is stated in that script's header.
      - name: No mounted template renders a literal `**` or a backtick
        run: node scripts/check-rendered-components.mjs "$UI_DIR"

      # 「缺检出必须是红」这件事本身也得有人守：拿一个不存在的目录跑上面两道闸，断言它们都退出 **2**。
      # 它防的是后来有人把上面那两条调用包进 `|| true`、或把闸改成一个安静的 0。
      #
      # The "a missing checkout must be red" fact needs a keeper of its own: run both gates above against
      # a directory that is not there and require exit **2** from each. It is what stops a later edit from
      # wrapping those calls in `|| true` or turning a gate into a quiet 0.
      - name: A missing checkout exits 2, never reads as a skip
        run: |
          set +e
          node scripts/check-rendered-copy.mjs "$RUNNER_TEMP/no-such-ui" >/dev/null 2>&1
          parse_rc=$?
          node scripts/check-rendered-components.mjs "$RUNNER_TEMP/no-such-ui" >/dev/null 2>&1
          mount_rc=$?
          set -e
          echo "the gates exited $parse_rc and $mount_rc for a missing checkout"
          test "$parse_rc" = 2
          test "$mount_rc" = 2

  governance-registry:
    name: Every governed module declares itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Pure Node. The registry collects the declarations Spring can see, so a running host can be
      # asked what is governed — but it cannot tell "not governed" from "forgotten". This check reads
      # the sources for the shape a governed module has and refuses one that never declared itself.
      # 纯 Node。登记处收的是 Spring 看得见的那些声明，故跑着的宿主可以被问到「管住了什么」——但它分不出
      # 「不受治理」与「被忘了」。这道检查在源码里读「受治理模块」的形状，拒掉一个从没自报的。
      - name: A governed module must declare itself, and under its own name
        run: node scripts/check-governance-registry.mjs

      # The assistant's page list is curated, and a curated list is a second place to forget: each
      # route it names is looked up in the menu tree the SQL we ship defines, composed the way the
      # console's router composes it — and then against the branches `module-scope.sql` keeps, because
      # a route can compose and still be switched off on this host. Pages in switched-off branches are
      # declared one by one, so a new one, a stale declaration or a healed branch is red. Pure Node.
      # 助手的页面清单是策展的，而策展清单就是第二个可以忘的地方：它点名的每条路径，都在**我们发布的 SQL**
      # 所定义的菜单树里查一遍，且按控制台路由的拼法拼；再查一遍 `module-scope.sql` 保留的支——因为一条路径
      # 可以拼得出来、在这台机器上却已被停用。停用支里的页面**逐页声明**，于是新增一页、声明过期、或某支又被
      # 启用，都会变红。纯 Node。
      - name: Every page the assistant offers must be one the console this deployment runs can open
        run: node scripts/check-console-pages.mjs

      # The deployment's seed manifest is reconciled with what it serves: every `sql/keelbase-*.sql`
      # has to be classified (`load` / `separate` / `skip` + reason), and a menu file for a keelbase-ui
      # page that is not loaded, or a top-level path the scope file does not keep, is the silent way a
      # page becomes unreachable (that is how YD-41's pages were lost). Pure Node.
      # 部署自己的种子清单与它服务的东西对账：每一份 `sql/keelbase-*.sql` 都必须归类（`load` /
      # `separate` / `skip` + 理由）；一份给 keelbase-ui 页面用的菜单文件没被 load、或一条顶级路径不在保留
      # 清单里，就是「页面变得到不了」的那种安静方式（YD-41 那几页就是这样丢的）。纯 Node。
      - name: The deployment's seed manifest must classify every SQL file and carry every menu it serves
        run: node scripts/check-seed-list.mjs

      # The administrator's password has one owner — the seed — and no gate carries a second copy of it.
      # `keelbase-demo-accounts.sql` rewrites `admin`'s password when the row still holds upstream's
      # default, so a database built from zero and one seeded before those accounts landed accept
      # different passwords; a gate with the literal `admin123` in it therefore ran on one family and
      # could not sign in on the other (measured 2026-10-26: no readings at all from a fresh seed). This
      # holds the seed's hashes against the resolver's table and refuses any `run-*.mjs` that writes the
      # password itself. Pure Node, no database.
      # 管理员口令只有一个属主——种子——没有一道门禁另存一份。`keelbase-demo-accounts.sql` 在 `admin` 仍装
      # 上游默认口令时改写它，故「从零建的库」与「那些账号落地之前灌的库」认不同口令；门禁里写死 `admin123`
      # 就只能在其中一套上跑、在另一套上登不进去（2026-10-26 实测：新灌的库一条读数也出不来）。本检查把种子的
      # 哈希与解析表对账，并拒掉任何自己写口令的 `run-*.mjs`。纯 Node、不连库。
      - name: The administrator's password is the seed's, and no gate keeps a copy
        run: node scripts/check-admin-credential.mjs

      # The nine-page identity matrix (issue `rain6fish/KeelBase-YuDao#2`) says which role may open
      # which governance page: the audit reader gets all but the conversation trace and the showcase,
      # the ordinary role gets the caller-scoped pages, and the showcase goes to nobody. Grants are
      # spread over several seed files in three matching shapes (role by code, role by id, menu by
      # path), so one line can flip a cell while nothing else notices. This reads the seed text and
      # compares the matrix cell by cell; it starts no stack and opens no database. Pure Node.
      # 九页身份矩阵（issue `rain6fish/KeelBase-YuDao#2`）说哪个角色能开哪一页治理页：审计读者拿到除决策
      # 轨迹与对抗证明外的全部；普通角色拿到按调用方限范围的那几页；对抗证明谁也不给。授予散在几份种子文件里、
      # 有三种匹配写法（角色按 code、角色按 id、菜单按路径），故一行就能翻转一格而别处毫无反应。这道检查读
      # 种子文本、逐格比对矩阵；不起栈、不连库。纯 Node。
      - name: The nine-page identity matrix must not be reversed by a grant change
        run: node scripts/check-identity-matrix.mjs

      # `/app/capabilities` 的 `businessModules` 是**声明**而非运行时探测，前端据此显隐导航。本测试把它
      # 与部署的两处事实对账：种子清单里的 `load` / `skip`，以及 `module-scope.sql` 的保留清单。纯 Node、
      # 不连库，故与上面那道种子清单检查互补：一道管页面到不了，一道管接口说错模块。
      #
      # `/app/capabilities`'s `businessModules` is a **declaration**, not a runtime probe, and the
      # frontend shows navigation from it. This test reconciles it with two deployment facts: `load` /
      # `skip` in the seed manifest, and the keep list in `module-scope.sql`. Pure Node, no database, so
      # it complements the seed check above: one catches an unreachable page, the other a wrong module.
      - name: The capabilities profile must advertise exactly the modules this deployment loads
        run: node --test scripts/capabilities-profile.test.mjs

      # The runtime's `/ai/chat`, `/ai/chat/stream` and `/ai/task` carry no `@PreAuthorize`, and the
      # engine's gate never consults the rule source. The AI module's send route has the same shape, and
      # AI1's session stream assembles tools. The host closes those entries for the audit reader itself;
      # this check keeps the guard, the list it reads and its registration from drifting apart.
      # 运行时的 `/ai/chat`、`/ai/chat/stream` 与 `/ai/task` 没有 `@PreAuthorize`，引擎的闸门也不查规则源。
      # AI 模块的发送路由同一形状，AI1 的会话流会装配工具。宿主自己为审计读者关掉这些入口；这道检查让守卫、
      # 它读的清单与它的注册不漂走。
      - name: The audit reader cannot reach any AI execution entry
        run: node scripts/check-audit-reader-execution-guard.mjs

      # The audit reader is also offered no write control on the governance pages: the server refuses
      # those writes, but a button that only refuses when pressed should not have been drawn. The role
      # rule is shared, and this check pins which controls obey it on all four pages.
      # 审计读者在治理页上也**不被递给**写控件：服务端会拒那些写，但一个点了才被拒的按钮本来就不该画出来。
      # 角色规则是共用的，这道检查钉住四个页面上哪些控件受它管。
      - name: The audit reader is offered no write control
        run: node scripts/check-audit-reader-write-controls.mjs

      # The truth table itself: audit_reader off, admin and every other role unchanged. Runs the
      # predicate extracted from the Vue helper, so the rule is executed rather than only pattern-matched.
      # 真值表本身：audit_reader 关、admin 与其余角色不变。跑的是从 Vue helper 里拆出的判据，故规则被
      # **执行**而不只是被模式匹配。
      - name: The write-control role rule is audit_reader, and only audit_reader
        run: node --test scripts/console-role.test.mjs

      # The ledger's `targetExists` used to answer only for the runtime's own `follow_up`, so every
      # host result type read as "no longer there" (Proxy-1, 2026-10-21: customer #1 still present).
      # This check keeps the compensator types and the host-side probes equal, and pins the three
      # rules the correction must obey.
      # 台账的 `targetExists` 曾只回答运行时自己的 `follow_up`，于是每种宿主结果类型都读作「已不在」
      # （Proxy-1，2026-10-21：客户 #1 仍在）。这道检查让补偿器类型与宿主探针保持一致，并钉住更正必须
      # 遵守的三条规则。
      - name: The ledger's target existence covers every host result type
        run: node scripts/check-effect-target-existence.mjs

  generator:
    name: The generated files are still a Spec's output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # `gen-from-spec.sh` resolves a JDK 25 for the one command; on a runner the toolchain is already
      # 25, so it is handed that home explicitly rather than letting the resolver download its own
      # copy (the download is the fallback, not the preferred path). Both checks are **offline**:
      # `--check` compares what the generator would write against what is committed, and
      # `--check-boundary` proves the two generated namespaces hold generated files and nothing else.
      # `gen-from-spec.sh` 为那一条命令解析一个 JDK 25；runner 上工具链本就是 25，故**显式**把这个 home 交给它，
      # 而不是让它自己去下载一份（下载是**兜底**，不是首选路径）。两道检查都是**离线**的：`--check`
      # 拿「生成器会写的」比对已提交的，`--check-boundary` 证明两个生成命名空间里只有生成物、没有别的。
      - name: A Spec's output must match what is committed
        run: KEELBASE_JDK25="$JAVA_HOME" bash scripts/gen-from-spec.sh specs/products.json --check
      - name: Only a Spec may write into the generated namespaces
        run: KEELBASE_JDK25="$JAVA_HOME" bash scripts/gen-from-spec.sh --check-boundary

  family-block:
    name: The generated family section still matches its stamp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Pure Node, and offline by construction: the section at the top of each README is generated in
      # the main repository, and each copy carries a sha256 of its own body on its BEGIN line — so a
      # repository can verify its own copy without checking out its siblings or reaching the network,
      # which is the only shape that works for a gate that has to live in every repository separately.
      #
      # 纯 Node，且**构造上**离线：每个 README 开头那一段是在主仓生成的，而每一份都在 BEGIN 行带着自身
      # 内容的 sha256 —— 于是任何仓都能在不检出兄弟仓、不联网的前提下自检本仓副本；对一道必须分别住在每个
      # 仓里的闸来说，这是唯一行得通的形状。
      - name: The family section in the READMEs must match its stamp
        run: node scripts/check-family-block.mjs

  # 这道 job **只**跑治理测试包 `cn.iocoder.yudao.server.keelbase`：那 20 个 `*Test` 类是纯 JUnit 5 +
  # Mockito，假 mapper、假服务顶住数据面，故不需要数据库、Redis 或端口。范围刻意这么窄，是为了让一条坏掉的
  # 治理事实在几分钟内**自己**变红、并且红在一个能指名道姓的 job 上，而不是排在需要整套栈、45 分钟上限的
  # `conformance` 后面才被发现。`-Dtest` 只在上面那一包里选；`-am` 只为让兄弟模块现编而不是从 `~/.m2` 取；
  # `failIfNoSpecifiedTests=false` 是给 `-am` 带上的那些模块用的——它们一条也匹配不上，不算失败。
  #
  # **不覆盖**：宿主其余包里的测试（它们仍只在 `conformance` 里跑、或在本机跑），ai1 模块自己的测试（在
  # `conformance` 里跑），以及依赖模块自带的上游测试套件（本仓照原样保留，从不在这里跑）。
  #
  # This job runs **only** the governance test package `cn.iocoder.yudao.server.keelbase`: those 20
  # `*Test` classes are plain JUnit 5 + Mockito, with fake mappers and services standing in for the
  # data face, so they need no database, Redis or port. The scope is deliberately this narrow so that
  # a broken governance fact turns red on its own in minutes, in a job that names it, rather than
  # behind the stack-bound `conformance` job and its 45-minute ceiling. `-Dtest` selects inside that
  # package only; `-am` is there so the sibling modules are built from source rather than resolved
  # from `~/.m2`; `failIfNoSpecifiedTests=false` is for those modules pulled in by `-am` — matching
  # nothing there is not a failure.
  #
  # **Not covered**: the rest of the host's test classes (they still run only inside `conformance`,
  # or locally), the ai1 module's own tests (they run inside `conformance`), and the dependency
  # modules' upstream suites (kept as found; never run here).
  governance-tests:
    name: The governance test package passes without a service stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # 本机 JDK 25 实测：20 个类、151 条，0 失败、0 跳过；`~/.m2` 已热时整条命令约 1 分钟。**这一步同时
      # 承担构建与测试**（`conformance` 是拆成两步、由整道 job 兜 45 分钟的），冷 runner 上要先编完
      # reactor、再下载依赖，故上限取 20 分钟而不是沿用那边测试步的 10 分钟。
      #
      # Measured locally on JDK 25: 20 classes, 151 tests, 0 failures, 0 skipped; about a minute for
      # the whole command with a warm `~/.m2`. This step **builds and tests in one go** (conformance
      # splits the two and lets its 45-minute job cover them), and a cold runner compiles the reactor
      # and downloads dependencies first — hence 20 minutes rather than conformance's 10.
      - name: Run the governance test package
        timeout-minutes: 20
        run: >-
          KEELBASE_JDK25="$JAVA_HOME" bash scripts/jdk25.sh mvn -B -ntp
          -pl yudao-server -am test -Dtest='cn.iocoder.yudao.server.keelbase.*Test'
          -Dsurefire.failIfNoSpecifiedTests=false

  conformance:
    name: The application conforms, and the four governance rates are readable
    runs-on: ubuntu-latest
    # A cold host needs the runtime built, the host built, the seed loaded and the server up. 45
    # minutes is a ceiling for a cold runner, not the expected time.
    # 冷 runner 要构建运行时、构建宿主、灌种子、起服务；45 分钟是**冷启动**的上限，不是通常耗时。
    timeout-minutes: 45
    services:
      postgres:
        # pgvector, not plain PostgreSQL: the line's datastore has the extension, and the conformance
        # suite's Schema column reads the runtime's migrations against the same datastore it ships on.
        # 用 pgvector 而不是普通 PostgreSQL：本线的数据存储带这个扩展，套件的 Schema 栏读的也是同一套。
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ruoyi-vue-pro
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U root -d ruoyi-vue-pro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      # 宿主钉的是**已发布**的运行时 `0.1.15`（Central 上有），故 CI 直接解析它，不再从公开仓按 SHA
      # 构建：一个 SNAPSHOT 只在本机 `~/.m2` 里，会让这套 job 在 runner 上永远缺件。抬运行时版本时，
      # 宿主 pom 的坐标与这里一起改。
      #
      # The host pins the **released** runtime `0.1.15` (available on Central), so CI resolves it
      # directly instead of building the public repository at a SHA: a SNAPSHOT lives only in a
      # developer's `~/.m2`, which left this job missing artifacts on the runner. When the runtime
      # version is bumped, the host pom's coordinate moves with it.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 宿主的 20 个 Java 测试类是纯 JUnit 5 + Mockito：假 mapper、假服务顶住数据面，故不需要数据库、
      # Redis 或端口。用 JDK 25 在本机实测：151 条，0 失败、0 跳过；构建之后单跑约 16 秒，故这一步的上限
      # 取 10 分钟（冷 runner 也够）。
      #
      # 先 `install` 而不是 `package`，是为了让下一步能在**单个模块**上跑测试：测试步不带 `-am`，兄弟模块
      # 从本步装进 `~/.m2` 的产物解析。这也让 surefire 的默认行为成为一道守卫——过滤范围一旦写错、一条都
      # 匹配不上，构建是**红**的（实测 exit 1），而不是「零测试也绿」。
      #
      # 范围**刻意**只到宿主的测试类与下面 ai1 模块自己的测试类：其余依赖模块自带上游的测试套件（今天
      # `-pl yudao-server -am` 整道 reactor 本机量到 1005 条，其中 ai1 的 195 条在下一步跑），那是上游的
      # 文件，本仓照原样保留，仍不在范围里。
      #
      # The host's 20 Java test classes are plain JUnit 5 + Mockito: fake mappers and services stand in
      # for the data face, so they need no database, Redis or port. Measured locally on JDK 25: 151
      # tests, 0 failures, 0 skipped; about 16 seconds on its own after the build, so this step's
      # ceiling is 10 minutes (enough on a cold runner).
      #
      # `install` rather than `package` lets the next step run tests on a **single module**: it omits
      # `-am`, resolving the sibling modules from what this step puts in `~/.m2`. That also makes
      # surefire's default a guard — if the filter is ever written wrong and matches nothing, the build
      # goes **red** (measured exit 1) instead of passing with zero tests.
      #
      # The scope is **deliberately** the host's test classes and, below, the ai1 module's own tests. The
      # remaining dependency modules carry upstream's own suites: the whole `-pl yudao-server -am`
      # reactor measures 1005 tests locally today, 195 of them ai1's (run in the next step); the other
      # 810 are upstream's files, kept as found, and stay out of scope.
      - name: Build the host
        run: >-
          KEELBASE_JDK25="$JAVA_HOME" bash scripts/jdk25.sh mvn -B -ntp
          -pl yudao-server -am -DskipTests install

      - name: Run the host's Java tests
        timeout-minutes: 10
        run: >-
          KEELBASE_JDK25="$JAVA_HOME" bash scripts/jdk25.sh mvn -B -ntp
          -pl yudao-server test -Dtest='cn.iocoder.yudao.server.**.*Test'

      # ai1 模块自己的测试类也在这里跑：24 个类、195 条，其中 `TraceScopedToolCallbackTest` 那 3 条守着
      # 「投递线程的 trace 带到工具执行线程、用完清掉」这条回归。它们与上面一样是纯 JUnit 5 + Mockito，
      # 不需要数据库、Redis 或端口——两条 Redis 集成测试（3 条）是 `@Disabled`，本机读数里记为 skipped。
      # 本步沿用上一步 `install` 装进 `~/.m2` 的兄弟模块产物，故同样不带 `-am`；同样靠 surefire 的默认
      # 行为当守卫：过滤范围一条都匹配不上，构建是**红**的（本机实测 exit 1）。用 JDK 25 在本机实测：
      # 195 条，0 失败、0 错误、3 跳过，整步约 40 秒，故上限取 10 分钟。
      #
      # The ai1 module's own test classes run here too: 24 classes, 195 tests, three of them in
      # `TraceScopedToolCallbackTest`, the regression that keeps the submitting thread's trace on the
      # tool thread and clears it afterwards. Like the host's, they are plain JUnit 5 + Mockito and need
      # no database, Redis or port — the two Redis integration tests (3 tests) are `@Disabled` and are
      # recorded as skipped in the local reading. This step reuses the modules the `install` step above
      # put in `~/.m2`, so it likewise omits `-am`, and it likewise leans on surefire's default as a
      # guard: a filter that matches nothing turns the build **red** (measured exit 1). Measured locally
      # on JDK 25: 195 tests, 0 failures, 0 errors, 3 skipped; about 40 seconds for the whole step, so
      # the ceiling is 10 minutes.
      - name: Run the ai1 module's tests
        timeout-minutes: 10
        run: >-
          KEELBASE_JDK25="$JAVA_HOME" bash scripts/jdk25.sh mvn -B -ntp
          -pl yudao-module-ai1-springai test -Dtest='cn.iocoder.yudao.module.ai1.**.*Test'

      - name: Load the seed into the service database
        env:
          PG_DB: ruoyi-vue-pro
          PG_USER: root
          PUBLIC_ORIGIN: http://127.0.0.1:48085
        run: |
          set -euo pipefail
          # GitHub gives service containers generated names; resolve the one by its image rather than
          # guessing. The scenario scripts talk to PostgreSQL through `docker exec`, so this is the
          # handle they need.
          # GitHub 给 service container 生成名字；按镜像解析出它，而不是猜。场景脚本通过 `docker exec`
          # 跟 PostgreSQL 说话，故这就是它们要的那个句柄。
          PG_CONTAINER="$(docker ps --filter ancestor=pgvector/pgvector:pg17 --format '{{.ID}}' | head -n1)"
          test -n "$PG_CONTAINER"
          # Export as well as persist: `GITHUB_ENV` reaches later steps, not this script's child.
          # 既要持久化也要导出：`GITHUB_ENV` 只到后续步骤，到不了本步脚本的子进程。
          export PG_CONTAINER
          echo "PG_CONTAINER=$PG_CONTAINER" >> "$GITHUB_ENV"
          bash deploy/demo-ecs/bootstrap-db.sh

      - name: Start the host and wait for it to answer UP
        env:
          PORT: '48085'
          PG_PORT: '55432'
          REDIS_PORT: '56379'
          PG_DB: ruoyi-vue-pro
          PG_USER: root
          PG_PASSWORD: password
        run: |
          set -euo pipefail
          # `run-server.sh` goes through `jdk25.sh`. The runner already has a JDK 25, so hand it that
          # home: the resolver would otherwise download a second copy. The download branch itself is
          # platform-aware, but it is the fallback, and CI should not depend on it.
          # `run-server.sh` 经 `jdk25.sh`。runner 上本就有 JDK 25，故把这个 home 交给它：否则解析器会
          # 再下载一份。下载那一档本身已按平台区分，但它是**兜底**，CI 不该依赖它。
          KEELBASE_JDK25="$JAVA_HOME" bash scripts/run-server.sh > host.log 2>&1 &
          echo $! > host.pid
          for i in $(seq 1 150); do
            if curl -fsS "http://127.0.0.1:48085/actuator/health" 2>/dev/null \
              | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              echo "host is UP after $((i * 2))s"
              exit 0
            fi
            if ! kill -0 "$(cat host.pid)" 2>/dev/null; then
              echo "the host exited before it became healthy" >&2
              tail -n 200 host.log >&2 || true
              exit 1
            fi
            sleep 2
          done
          echo "the host did not become healthy in 300s" >&2
          tail -n 200 host.log >&2 || true
          exit 1

      - name: Run the conformance suite and require the four rates
        env:
          HOST_URL: http://127.0.0.1:48085
          PG_DB: ruoyi-vue-pro
          PG_USER: root
          PG_PASSWORD: password
          CONFORMANCE_NO_MODEL_KEY: '1'
          # 一次性栈：门禁把确认行留着，好让 RY-19 的确认率（2.3）有分母。共用库上**绝不**置这个。
          # An ephemeral stack: the gates keep their confirmation rows so RY-19's confirmation rate
          # (2.3) has a denominator. **Never** set this against a shared database.
          KEEP_CONFIRMATIONS: '1'
        run: |
          set -euo pipefail
          # 闸门自己跑套件并做结构判决：四率必须是 `[01].[0-9]{3}`（`-` / `0/0` 不是读数），
          # SKIP 集合必须恰好是 `Tool path (MCP)` 与 `Confirmation` 两栏——多一栏、少一栏都红。
          # 判据在脚本头部，只有一处。
          # The gate runs the suite and makes the structural verdict: the four rates must be
          # `[01].[0-9]{3}` (`-` / `0/0` are not readings), and the SKIP set must be exactly the two
          # model-path columns — one extra or one missing is red. The rules live in the script's header.
          node scripts/ci/run-governance-gate.mjs | tee conformance.out

      - name: Report the host's tail when the run went red
        if: failure()
        run: tail -n 200 host.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-conformance
          path: |
            conformance/reports/
            conformance.out
            host.log
          if-no-files-found: warn
